<template>
    <div class="slds-p-top_small">
        <img
            src={_product.imagem}
            class="product slds-align_absolute-center"
            width="150"
            height="150"
            alt={_product.nome}
        />

        <p class="title slds-align_absolute-center">
            {_product.nome}
        </p>

        <p class="price slds-align_absolute-center">
            <lightning-formatted-number
                value={_product.preco}
                format-style="currency"
                currency-code="BRL"
                minimum-fraction-digits="2"
                maximum-fraction-digits="2">
            </lightning-formatted-number>
        </p>
        <div class = "slds-p-top_small slds-align_absolute-center">
            <lightning-button
                variant = "brand"
                label = "Adicionar ao carrinho"
                class = "slds-m-left_x-small"
                onclick = {handleProductSelected}
            ></lightning-button>
        </div>
    </div>
</template>
